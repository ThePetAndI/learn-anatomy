<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" data-diagram="d_autonomic">
  <title>Вегетативная нервная система (схема)</title>
  <!--
    Схема, а не вид тела: посередине головной и спинной мозг, слева —
    симпатическая часть, справа — парасимпатическая. На самом деле обе
    части есть с каждой стороны тела.
    Серым на спинном мозге отмечены сегменты, где лежат вегетативные
    нейроны: от I грудного до II поясничного — симпатические, II–IV
    крестцовые — парасимпатические.
    Слева: из грудопоясничных сегментов волокна идут в симпатический ствол —
    цепочку узлов вдоль позвоночника; от верхнего шейного узла — к глазу,
    от шейных и верхних грудных — к сердцу. Большой внутренностный нерв
    проходит ствол без переключения и кончается в чревных узлах внутри
    чревного (солнечного) сплетения; от него — к желудку.
    Справа: глазодвигательный нерв из среднего мозга — к ресничному узлу
    и глазу; блуждающий из продолговатого мозга — к сердцу и желудку;
    тазовые внутренностные нервы из крестцовых сегментов — к мочевому пузырю.
    Органы — без подписи.
  -->
  <!-- центральная нервная система: сегменты с вегетативными нейронами — серым -->
  <ellipse class="brain" cx="180" cy="44" rx="44" ry="32"/>
  <rect class="brain" x="172" y="70" width="16" height="42"/>
  <rect class="brain" x="174" y="108" width="12" height="314" rx="6"/>
  <rect class="grey" x="174" y="170" width="12" height="152"/>
  <rect class="grey" x="174" y="366" width="12" height="34"/>

  <!-- органы -->
