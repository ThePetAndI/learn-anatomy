<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" data-diagram="d_arm_veins">
  <title>Поверхностные вены правой руки (вид спереди)</title>
  <!--
    Тот же контур, что на схеме артерий руки: большой палец слева, туловище справа.
    Латеральная подкожная вена (cephalic) — по наружной стороне, вверху уходит
    в борозду между дельтовидной и большой грудной мышцами к подмышечной вене.
    Медиальная (basilic) — по внутренней, на середине плеча уходит вглубь.
    Промежуточная вена локтя идёт косо: от латеральной снизу вверх к медиальной.
    Пунктир — глубокая подмышечная вена, она без подписи.
  -->
  <path class="outline" d="M360 20H300C240 18 180 30 160 70C148 100 150 140 156 180L150 320C146 360 140 440 142 530C130 560 124 600 140 630H232C248 600 246 560 236 530C242 440 248 360 252 320L262 190C268 160 290 140 320 136H360Z"/>
  <path class="landmark" d="M340 40C290 44 240 50 196 58"/>

  <!-- глубокая подмышечная вена — ориентир -->
  <path class="vessel-deoxy behind" stroke-width="8" d="M240 232C242 180 242 130 242 88"/>

  <g data-term="t_subclavian_vein">
    <path class="hit" stroke-width="48" d="M242 88C280 76 316 64 352 56"/>
    <path class="vessel-deoxy" stroke-width="10" d="M242 88C280 76 316 64 352 56"/>
  </g>
  <g data-term="t_cephalic_vein">
    <path class="hit" stroke-width="48" d="M148 548C148 500 150 440 154 390C158 330 162 270 166 210C172 150 190 112 214 96C224 90 234 88 242 88"/>
    <path class="vessel-deoxy" stroke-width="6" d="M148 548C148 500 150 440 154 390C158 330 162 270 166 210C172 150 190 112 214 96C224 90 234 88 242 88"/>
  </g>
  <g data-term="t_basilic_vein">
    <path class="hit" stroke-width="48" d="M226 548C232 500 238 440 242 390C246 350 246 310 244 270C242 254 241 242 240 232"/>
    <path class="vessel-deoxy" stroke-width="6" d="M226 548C232 500 238 440 242 390C246 350 246 310 244 270C242 254 241 242 240 232"/>
  </g>
  <g data-term="t_median_cubital_vein">
    <path class="hit" stroke-width="48" d="M156 366C180 352 214 334 245 318"/>
    <path class="vessel-deoxy" stroke-width="5" d="M156 366C180 352 214 334 245 318"/>
  </g>
</svg>
