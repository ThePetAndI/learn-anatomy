<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" data-diagram="d_head_neck">
  <title>Артерии головы и шеи (вид справа)</title>
  <!--
    Вид справа: лицо обращено вправо. Общая сонная артерия поднимается
    по шее и на уровне верхнего края щитовидного хряща делится. Внутренняя
    сонная идёт позади (на рисунке левее) и без ветвей входит в череп;
    наружная — впереди, отдаёт лицевую артерию (через край нижней челюсти
    к углу рта) и заканчивается у шейки нижней челюсти, продолжаясь
    поверхностной височной артерией впереди уха. Позвоночная артерия —
    ветвь подключичной — поднимается позади всех, в шейных позвонках.
  -->

  <!-- контур головы и шеи, ухо — ориентиры -->
  <path class="outline" d="M180 22C110 22 70 66 66 126C62 170 74 206 94 228C104 262 104 300 102 340V480H248V360C250 330 254 300 262 282C278 278 286 268 286 254C292 250 300 244 302 234C306 220 300 210 296 204C304 196 306 182 300 172C312 162 314 146 302 136C300 104 288 74 262 50C240 32 212 22 180 22Z"/>
  <path class="landmark" d="M188 176C178 172 172 182 174 194C176 208 186 218 196 214C204 210 204 196 198 186"/>
  <path class="landmark" d="M262 282C240 290 220 290 206 280"/>

  <!-- головной мозг в полости черепа -->
  <g data-term="t_brain" data-hit="area">
    <path class="organ" d="M178 40C124 40 92 72 90 108C88 136 104 152 130 156C160 160 196 158 222 152C248 146 268 130 272 108C274 76 240 40 178 40Z"/>
  </g>

  <!-- позвоночная артерия: позади всех, от подключичной -->
  <g data-term="t_vertebral_artery">
    <path class="hit" stroke-width="48" d="M150 470C142 430 138 380 138 320C138 270 140 236 148 214C154 194 164 172 178 158"/>
    <path class="vessel-oxy" stroke-width="7" d="M150 470C142 430 138 380 138 320C138 270 140 236 148 214C154 194 164 172 178 158"/>
  </g>

  <!-- подключичная артерия у ключицы -->
  <g data-term="t_subclavian_artery">
    <path class="hit" stroke-width="48" d="M112 474C150 470 190 470 232 474"/>
    <path class="vessel-oxy" stroke-width="10" d="M112 474C150 470 190 470 232 474"/>
  </g>

  <!-- общая сонная и её деление -->
  <g data-term="t_common_carotid_artery">
    <path class="hit" stroke-width="48" d="M206 470C206 420 206 360 208 300"/>
    <path class="vessel-oxy" stroke-width="11" d="M206 470C206 420 206 360 208 300"/>
  </g>
  <g data-term="t_internal_carotid_artery">
    <path class="hit" stroke-width="48" d="M208 300C198 270 190 240 190 210C190 186 194 168 204 158"/>
    <path class="vessel-oxy" stroke-width="9" d="M208 300C198 270 190 240 190 210C190 186 194 168 204 158"/>
  </g>
  <g data-term="t_external_carotid_artery">
    <path class="hit" stroke-width="48" d="M208 300C218 272 226 244 230 214"/>
    <path class="vessel-oxy" stroke-width="8" d="M208 300C218 272 226 244 230 214"/>
  </g>
  <g data-term="t_facial_artery">
    <path class="hit" stroke-width="48" d="M216 278C232 282 248 280 258 266C266 248 274 226 284 200"/>
    <path class="vessel-oxy" stroke-width="5" d="M216 278C232 282 248 280 258 266C266 248 274 226 284 200"/>
  </g>
  <g data-term="t_superficial_temporal_artery">
    <path class="hit" stroke-width="48" d="M230 214C230 196 232 180 236 166"/>
    <path class="vessel-oxy" stroke-width="5" d="M230 214C230 196 232 180 236 166"/>
  </g>
</svg>
