  <path class="brain" d="M188 268C170 268 158 282 160 300L162 320H200L202 300C204 282 198 270 188 268Z"/>
  <path class="brain" d="M190 228C176 222 148 226 144 246C142 264 156 278 176 280C190 280 198 270 198 254C198 242 196 232 190 228Z"/>

