<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" data-diagram="d_brain_cortex">
  <title>Двигательная и чувствительная кора (левое полушарие)</title>
  <!--
    То же полушарие, что на схеме «снаружи»: вид слева, лобная доля слева.
    По обе стороны центральной борозды — две извилины: впереди
    предцентральная (двигательная кора), позади постцентральная
    (чувствительная). На схеме они нарочно шире, чем в жизни, — чтобы
    по ним можно было попасть пальцем. Извилины вложены в свои доли:
    «найди лобную долю» засчитывает и предцентральную извилину.
    Борозды здесь без подписи.
  -->
