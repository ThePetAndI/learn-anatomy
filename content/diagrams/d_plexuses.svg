<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" data-diagram="d_plexuses">
  <title>Сплетения спинномозговых нервов (вид спереди)</title>
  <!--
    Вид спереди, правая сторона тела слева; посередине — тела позвонков
    (7 шейных, 12 грудных, 5 поясничных) и крестец. Справа от позвонков на
    рисунке и слева — передние ветви спинномозговых нервов.
    Шейное сплетение — C1–C4, от него вниз идёт диафрагмальный нерв
    (C3–C5) к куполу диафрагмы. Плечевое — C5–T1, уходит к подмышке.
    Грудные ветви сплетений не образуют — это межрёберные нервы (показаны
    II–XI). Поясничное — L1–L4: бедренный нерв уходит вниз и кнаружи,
    запирательный — вниз и к середине. Крестцовое — L4–S4, даёт седалищный нерв.
    IV поясничный нерв участвует в обоих нижних сплетениях.
  -->
