<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" data-diagram="d_spinal_cord">
  <title>Спинной мозг в позвоночном канале (вид сзади)</title>
  <!--
    Дуги позвонков сняты, вид сзади; правая и левая стороны одинаковы.
    Спинной мозг от большого затылочного отверстия до мозгового конуса на
    уровне I–II поясничных позвонков; утолщения — шейное (нервы к рукам)
    и пояснично-крестцовое (к ногам). Ниже конуса — концевая нить (без
    подписи) и корешки конского хвоста: нижние сегменты лежат выше
    одноимённых позвонков, поэтому корешки идут вниз тем круче, чем ниже.
    Внутри канала — корешки; спинномозговой нерв начинается у отверстия,
    снаружи канала. Показаны все 31 пара: 8 шейных, 12 грудных,
    5 поясничных, 5 крестцовых, 1 копчиковая; выделен шестой грудной сегмент.
  -->
  <!-- основание черепа и стенки канала -->
