<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" data-diagram="d_cranial_nerves">
  <title>Черепные нервы на основании мозга (вид снизу)</title>
  <!--
    Мозг снизу, лоб вверху; как на виде спереди, правая сторона — слева.
    Сверху вниз: под лобными долями — обонятельные луковицы с нитями
    обонятельного нерва (I; сама луковица и тракт — часть мозга, без
    подписи); зрительные нервы (II) сходятся в перекрёст. Из среднего мозга
    между его ножками выходит глазодвигательный (III); блоковый (IV) —
    единственный выходит сзади и показывается сбоку от ножки. От боковой
    части моста — тройничный (V), самый толстый. На границе моста
    и продолговатого мозга: у середины — отводящий (VI), сбоку — лицевой
    (VII) и преддверно-улитковый (VIII). Сбоку от оливы продолговатого мозга —
    языкоглоточный (IX) и блуждающий (X); добавочный (XI) поднимается
    вдоль спинного мозга. Между пирамидой и оливой — подъязычный (XII).
    Нервы разведены веером, чтобы по ним можно было попасть пальцем:
    концы нервов на схеме не совпадают с отверстиями черепа.
  -->
  <path class="brain" d="M176 18C122 14 72 38 58 92C52 120 60 144 82 150C112 156 150 150 176 148ZM184 18C238 14 288 38 302 92C308 120 300 144 278 150C248 156 210 150 184 148Z"/>
  <path class="brain" d="M84 158C58 168 44 206 50 246C56 272 86 288 114 282C132 276 142 256 144 232C144 206 136 178 120 164C108 156 96 154 84 158ZM276 158C302 168 316 206 310 246C304 272 274 288 246 282C228 276 218 256 216 232C216 206 224 178 240 164C252 156 264 154 276 158Z"/>
  <path class="brain" d="M178 316C140 304 92 310 72 340C56 366 70 404 110 420C142 430 170 424 178 404ZM182 316C220 304 268 310 288 340C304 366 290 404 250 420C218 430 190 424 182 404Z"/>
  <path class="sulcus" stroke-width="1.5" d="M180 20V146"/>

  <!-- обонятельные луковицы и тракты, ножки среднего мозга -->
  <ellipse class="brain" cx="160" cy="46" rx="7" ry="14"/>
  <ellipse class="brain" cx="200" cy="46" rx="7" ry="14"/>
  <path class="membrane" stroke-width="5" d="M160 60C160 90 162 118 166 140M200 60C200 90 198 118 194 140"/>
  <path class="brain" d="M178 184C166 186 156 192 150 204L166 214C170 204 174 196 178 190ZM182 184C194 186 204 192 210 204L194 214C190 204 186 196 182 190Z"/>

