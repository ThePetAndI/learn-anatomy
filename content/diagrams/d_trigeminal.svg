<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" data-diagram="d_trigeminal">
  <title>Тройничный нерв (вид справа)</title>
  <!--
    Три оттенка фона — кожа, которую иннервируют ветви: лоб, верхнее веко,
    спинка носа — глазной нерв; нижнее веко, щека, верхняя губа — верхнечелюстной;
    нижняя губа, подбородок, челюсть и висок впереди уха — нижнечелюстной.
    Границы зон на схеме приблизительные; угол нижней челюсти в них не входит —
    его кожу иннервируют шейные нервы.
    Нервы в глубине — пунктиром: узел тройничного нерва, три его ветви,
    нижний альвеолярный нерв в канале челюсти. На кожу они выходят через
    отверстия: надглазничную вырезку, подглазничное и подбородочное отверстия.
    Ветви вложены в тройничный нерв: «найди тройничный нерв» принимает любую.
  -->
  <path class="outline" d="M150 20C80 24 38 80 38 160C38 220 56 262 84 290C96 330 92 380 90 420H238C236 392 236 368 244 350C268 346 288 344 298 340C312 334 318 324 316 312C314 300 310 294 312 288C322 282 324 272 316 266C324 258 326 248 316 240C314 232 314 226 318 222C332 218 342 210 338 200C330 186 312 168 300 156C302 146 304 138 298 128C298 96 286 62 256 42C228 24 190 18 150 20Z"/>
  <path class="zone-1" d="M338 200C330 186 312 168 300 156C304 146 304 138 298 128C298 96 286 62 256 42C228 24 190 18 150 20C140 20 132 22 124 24C150 70 196 112 226 132C246 144 262 146 280 148C300 160 322 184 338 200Z"/>
  <path class="zone-2" d="M226 132C246 144 262 146 280 148C300 160 322 184 338 200C342 210 332 218 318 222C314 226 314 232 316 240C326 248 324 258 316 266H300C276 262 252 258 232 250C214 244 196 232 188 214C186 196 196 160 226 132Z"/>
  <path class="zone-3" d="M316 266C324 272 322 282 312 288C310 294 314 300 316 312C318 324 312 334 298 340C276 344 252 346 232 340C220 330 212 316 206 300C200 282 192 262 186 246C182 226 180 200 182 170C184 150 190 130 200 116C196 150 188 190 188 214C196 232 214 244 232 250C252 258 276 262 300 266Z"/>
  <path class="landmark" d="M146 186C130 186 124 206 128 224C132 242 144 254 156 250C166 246 168 232 160 222C168 210 164 190 146 186Z"/>
  <path class="landmark" d="M180 244C182 276 186 304 194 322C222 334 262 342 298 342"/>
  <circle class="landmark" cx="268" cy="150" r="22"/>

  <!-- тройничный нерв: корешок и узел в глубине, три ветви, их конечные нервы -->
  <g data-term="t_trigeminal_nerve">
    <path class="hit" stroke-width="48" d="M150 194C166 194 180 192 194 190"/>
    <path class="nerve behind" stroke-width="9" d="M150 194C166 194 180 192 194 190M192 176C204 182 206 198 194 206"/>
    <g data-term="t_ophthalmic_nerve">
      <path class="hit" stroke-width="48" d="M198 182C216 170 236 158 258 146"/>
      <path class="nerve behind" stroke-width="5" d="M198 182C216 170 236 158 258 146"/>
      <g data-term="t_supraorbital_nerve">
        <path class="hit" stroke-width="48" d="M262 140C268 128 272 118 274 104C276 84 274 64 270 46"/>
        <path class="nerve" stroke-width="3.5" d="M262 140C268 128 272 118 274 104C276 84 274 64 270 46M274 104C266 90 258 78 248 66"/>
      </g>
    </g>
    <g data-term="t_maxillary_nerve">
      <path class="hit" stroke-width="48" d="M200 194C220 198 242 200 262 198"/>
      <path class="nerve behind" stroke-width="5" d="M200 194C220 198 242 200 262 198"/>
      <g data-term="t_infraorbital_nerve">
        <path class="hit" stroke-width="48" d="M262 198L274 196C282 204 290 214 300 222M274 196C284 200 296 204 308 206M274 196C278 210 284 226 290 240"/>
        <path class="nerve behind" stroke-width="3.5" d="M262 198L274 196"/>
        <path class="nerve" stroke-width="3" d="M274 196C282 204 290 214 300 222M274 196C284 200 296 204 308 206M274 196C278 210 284 226 290 240"/>
      </g>
    </g>
    <g data-term="t_mandibular_nerve">
      <path class="hit" stroke-width="48" d="M196 204C200 224 204 244 206 262"/>
      <path class="nerve behind" stroke-width="5" d="M196 204C200 224 204 244 206 262"/>
      <g data-term="t_inferior_alveolar_nerve">
        <path class="hit" stroke-width="48" d="M206 262C214 290 230 308 256 316C266 318 272 318 280 318"/>
        <path class="nerve behind" stroke-width="3.5" d="M206 262C214 290 230 308 256 316C266 318 272 318 280 318"/>
        <g data-term="t_mental_nerve">
          <path class="hit" stroke-width="48" d="M280 318C290 312 300 304 310 296M280 318C292 318 304 318 314 318"/>
          <path class="nerve" stroke-width="3" d="M280 318C290 312 300 304 310 296M280 318C292 318 304 318 314 318"/>
        </g>
      </g>
    </g>
  </g>

  <!-- отверстия, через которые нервы выходят на лицо -->
  <g data-term="t_infraorbital_foramen" data-hit="area">
    <circle class="hit hit-area" cx="274" cy="196" r="24"/>
    <circle class="outline" cx="274" cy="196" r="5"/>
  </g>
  <g data-term="t_mental_foramen" data-hit="area">
    <circle class="hit hit-area" cx="280" cy="318" r="24"/>
    <circle class="outline" cx="280" cy="318" r="5"/>
  </g>
</svg>
