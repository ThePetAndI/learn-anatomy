<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" data-diagram="d_leg_nerves">
  <title>Нервы ноги: правая нога спереди и сзади</title>
  <!--
    Слева — правая нога спереди (наружная сторона слева, наколенник
    пунктиром), справа — та же нога сзади (наружная сторона справа,
    подколенная ямка пунктиром).
    Спереди: под паховой связкой (пунктир вверху) выходит бедренный нерв
    и ветвится в четырёхглавой мышце; по внутренней стороне бедра —
    запирательный нерв. Общий малоберцовый нерв огибает шейку малоберцовой
    кости снаружи; его ветвь, глубокий малоберцовый нерв (без подписи,
    пунктир), идёт в глубине к передней большеберцовой мышце.
    Сзади: седалищный нерв идёт по середине бедра и над подколенной ямкой
    делится: большеберцовый — прямо вниз, под икроножной мышцей (пунктир),
    общий малоберцовый — наискось кнаружи к головке малоберцовой кости.
  -->
  <!-- нога спереди -->
  <path class="outline" d="M20 20H150C152 80 144 160 136 240C132 290 130 320 128 340C126 380 122 440 116 520C114 540 114 556 116 570C130 590 130 606 116 610H52C40 606 40 592 52 570C56 556 56 540 54 520C48 440 44 380 42 340C38 300 30 240 24 160C20 100 18 60 20 20Z"/>
  <path class="landmark" d="M10 12C60 22 120 26 160 20"/>
  <circle class="landmark" cx="86" cy="330" r="14"/>
  <g data-term="t_quadriceps_femoris" data-hit="area">
    <path class="muscle" d="M38 60C60 40 120 40 140 70C140 160 130 250 114 312C104 324 70 324 60 312C44 250 34 150 38 60Z"/>
  </g>
  <g data-term="t_tibialis_anterior" data-hit="area">
    <path class="muscle" d="M44 360C56 348 82 346 90 358L86 520C84 534 64 534 60 520Z"/>
  </g>

  <!-- нога сзади -->
  <path class="outline" d="M330 20H200C198 80 206 160 214 240C218 290 220 320 222 340C224 380 228 440 234 520C236 540 236 556 234 570C220 590 220 606 234 610H298C310 606 310 592 298 570C294 556 294 540 296 520C302 440 306 380 308 340C312 300 320 240 326 160C330 100 332 60 330 20Z"/>
  <path class="landmark" d="M275 290L295 320L275 350L255 320Z"/>
  <g data-term="t_gastrocnemius" data-hit="area">
    <path class="muscle" d="M240 330C254 318 296 318 310 330C318 380 308 440 288 476C280 488 268 488 260 476C240 440 232 380 240 330Z"/>
  </g>

  <!-- нервы спереди -->
  <g data-term="t_femoral_nerve">
    <path class="hit" stroke-width="48" d="M110 14C108 40 104 60 98 80"/>
    <path class="nerve" stroke-width="5" d="M110 14C108 40 104 60 98 80"/>
    <path class="nerve" stroke-width="2.5" d="M98 80C86 110 74 150 66 190M98 80C96 130 94 180 92 230M98 80C108 120 114 160 116 200"/>
  </g>
  <g data-term="t_obturator_nerve">
    <path class="hit" stroke-width="48" d="M150 30C150 70 148 110 144 150C142 180 140 210 138 240"/>
    <path class="nerve" stroke-width="3" d="M150 30C150 70 148 110 144 150C142 180 140 210 138 240"/>
  </g>
  <g data-term="t_common_fibular_nerve">
    <path class="hit" stroke-width="48" d="M30 312C30 334 36 350 48 360"/>
    <path class="nerve" stroke-width="3.5" d="M30 300C30 334 36 350 48 360"/>
    <path class="nerve behind" stroke-width="2.5" d="M48 360C58 368 64 384 66 404C68 440 68 480 66 520"/>
  </g>

  <!-- нервы сзади -->
  <g data-term="t_sciatic_nerve">
    <path class="hit" stroke-width="48" d="M262 20C266 100 270 200 274 290"/>
    <path class="nerve" stroke-width="7" d="M262 20C266 100 270 200 274 290"/>
  </g>
  <g data-term="t_tibial_nerve">
    <path class="hit" stroke-width="48" d="M274 290C274 330 274 360 274 384M270 484C269 520 268 550 268 570"/>
    <path class="nerve" stroke-width="5" d="M274 290C274 330 274 360 274 380"/>
    <path class="nerve behind" stroke-width="5" d="M274 380C272 440 270 500 268 570"/>
  </g>
  <g data-term="t_common_fibular_nerve">
    <path class="hit" stroke-width="48" d="M278 294C292 306 306 322 318 344"/>
    <path class="nerve" stroke-width="3.5" d="M274 290C290 304 306 322 318 344"/>
  </g>
</svg>
