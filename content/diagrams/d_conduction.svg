<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" data-diagram="d_conduction">
  <title>Проводящая система сердца (схема)</title>
  <!--
    Тот же разрез, что на схеме «Сердце в разрезе»: вид спереди, правая
    сторона тела слева. Камеры и сосуды — только фон, без подписей.
    Синусно-предсердный узел — в стенке правого предсердия у впадения
    верхней полой вены; предсердно-желудочковый — в нижней части
    межпредсердной перегородки над трёхстворчатым клапаном. Пучок идёт
    к верху межжелудочковой перегородки и делится на правую и левую
    ножки; волокна Пуркинье расходятся под эндокардом желудочков.
  -->

  <!-- фон: полые вены, стенка и камеры -->
  <path class="vessel-deoxy" stroke-width="24" d="M128 14V142"/>
  <path class="vessel-deoxy" stroke-width="26" d="M104 452V250"/>
  <path class="muscle" d="M92 128C70 136 62 170 64 210C66 250 78 284 104 318C150 372 214 404 272 424C290 430 302 420 302 402C306 330 312 240 308 172C306 136 288 114 260 114H120C108 114 100 120 92 128Z"/>
  <path class="septum" stroke-width="12" d="M180 136V214"/>
  <path class="septum" stroke-width="14" d="M214 274L250 396"/>
  <path class="cavity-deoxy" d="M96 146C90 160 86 186 90 214C94 238 104 254 118 262H160C168 262 172 256 172 248V144C172 134 166 128 156 128H110C102 128 98 136 96 146Z"/>
  <path class="cavity-oxy" d="M198 126H284C294 126 300 134 300 144V186C300 194 294 200 286 200H198C192 200 188 194 188 188V136C188 130 192 126 198 126Z"/>
  <path class="cavity-oxy" d="M218 232H290C298 232 302 240 300 250C296 300 292 340 282 380C278 394 266 396 260 386L224 290C220 278 210 232 218 232Z"/>
  <path class="cavity-deoxy" d="M120 280H198C204 280 208 284 210 292L234 384C236 396 226 402 214 396C176 376 140 348 120 318C112 304 110 280 120 280Z"/>

  <!-- проводящая система -->
  <g data-term="t_conducting_system_of_heart">
    <g data-term="t_purkinje_fibers">
      <path class="hit" stroke-width="48" d="M228 386C196 380 160 362 132 332 M254 384C276 364 290 320 294 276"/>
      <path class="conduct" stroke-width="2.5" d="M228 386C196 380 160 362 132 332M196 376C190 362 182 352 172 346M160 360C154 346 146 338 138 334M254 384C276 364 290 320 294 276M274 360C266 346 262 336 260 322M286 328C276 316 272 304 272 292"/>
    </g>
    <g data-term="t_atrioventricular_bundle">
      <path class="hit" stroke-width="48" d="M178 246L214 282C212 318 218 352 228 386 M214 282C226 314 240 350 254 384"/>
      <path class="conduct" stroke-width="5" d="M178 246L214 282C212 318 218 352 228 386M214 282C226 314 240 350 254 384"/>
    </g>
    <g data-term="t_atrioventricular_node" data-hit="area">
      <circle class="hit hit-area" cx="174" cy="240" r="24"/>
      <ellipse class="node" cx="174" cy="240" rx="10" ry="7"/>
    </g>
    <g data-term="t_sinoatrial_node" data-hit="area">
      <circle class="hit hit-area" cx="116" cy="142" r="24"/>
      <ellipse class="node" cx="116" cy="142" rx="12" ry="7"/>
    </g>
  </g>
</svg>
