<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" data-diagram="d_nervous_system">
  <title>Нервная система целиком (схема)</title>
  <!--
    Вид спереди, правая сторона тела слева; середина — x = 180.
    Центральная нервная система — головной мозг и спинной мозг; спинной мозг
    у взрослого кончается на уровне I–II поясничных позвонков, примерно у пояса.
    Периферическая — нервы: к рукам от шейной части спинного мозга, межрёберные
    от грудной, к ногам — от поясничной и крестцовой частей (ниже конца
    спинного мозга их корешки идут вниз в позвоночном канале — здесь не показаны).
    Нервы ниже в файле нарисованы раньше мозга: у середины нажатие достаётся
    спинному мозгу.
  -->
  <path class="outline" d="M180 14C200 14 212 30 212 52C212 72 204 84 196 90V104C214 108 240 110 252 120C262 128 266 140 268 152L292 250L306 322C308 334 300 338 294 330L270 258L246 172V330L236 576C236 586 226 590 214 590H198C192 590 190 584 190 576L186 360H174L170 576C170 584 168 590 162 590H146C134 590 124 586 124 576L114 330V172L90 258L66 330C60 338 52 334 54 322L68 250L92 152C94 140 98 128 108 120C120 110 146 108 164 104V90C156 84 148 72 148 52C148 30 160 14 180 14Z"/>

  <g data-term="t_nervous_system">
    <g data-term="t_peripheral_nervous_system">
      <!-- нервы рук -->
      <g data-term="t_nerve">
        <path class="hit" stroke-width="48" d="M176 124C152 128 126 138 112 156L84 254L62 322"/>
        <path class="nerve" stroke-width="3.5" d="M176 124C152 128 126 138 112 156L84 254L62 322"/>
      </g>
      <g data-term="t_nerve">
        <path class="hit" stroke-width="48" d="M184 124C208 128 234 138 248 156L276 254L298 322"/>
        <path class="nerve" stroke-width="3.5" d="M184 124C208 128 234 138 248 156L276 254L298 322"/>
      </g>
      <!-- межрёберные нервы -->
      <g data-term="t_nerve">
        <path class="hit" stroke-width="48" d="M176 172C160 174 140 180 124 190M176 200C160 202 140 208 124 218M176 228C160 230 140 236 124 246"/>
        <path class="nerve" stroke-width="2.5" d="M176 172C160 174 140 180 124 190M176 200C160 202 140 208 124 218M176 228C160 230 140 236 124 246"/>
      </g>
      <g data-term="t_nerve">
        <path class="hit" stroke-width="48" d="M184 172C200 174 220 180 236 190M184 200C200 202 220 208 236 218M184 228C200 230 220 236 236 246"/>
        <path class="nerve" stroke-width="2.5" d="M184 172C200 174 220 180 236 190M184 200C200 202 220 208 236 218M184 228C200 230 220 236 236 246"/>
      </g>
      <!-- нервы ног -->
      <g data-term="t_nerve">
        <path class="hit" stroke-width="48" d="M178 300C176 324 166 344 152 362C146 380 146 420 146 470V580"/>
        <path class="nerve" stroke-width="3.5" d="M178 300C176 324 166 344 152 362C146 380 146 420 146 470V580"/>
      </g>
      <g data-term="t_nerve">
        <path class="hit" stroke-width="48" d="M182 300C184 324 194 344 208 362C214 380 214 420 214 470V580"/>
        <path class="nerve" stroke-width="3.5" d="M182 300C184 324 194 344 208 362C214 380 214 420 214 470V580"/>
      </g>
    </g>

    <g data-term="t_central_nervous_system">
      <g data-term="t_brain" data-hit="area">
        <ellipse class="brain" cx="180" cy="48" rx="26" ry="24"/>
        <path class="sulcus" stroke-width="1.5" d="M180 26V70M166 34C172 40 170 48 164 52M194 34C188 40 190 48 196 52"/>
      </g>
      <g data-term="t_spinal_cord">
        <rect class="hit hit-area" x="156" y="72" width="48" height="232"/>
        <rect class="brain" x="176" y="70" width="8" height="232" rx="4"/>
      </g>
    </g>
  </g>
</svg>
