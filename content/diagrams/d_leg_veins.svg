<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" data-diagram="d_leg_veins">
  <title>Вены правой ноги: спереди и сзади (схема)</title>
  <!--
    Слева — правая нога спереди (внутренняя сторона справа от неё),
    справа — та же нога сзади (внутренняя сторона слева от неё).
    Большая подкожная вена — по внутренней стороне, впереди внутренней
    лодыжки, в паху впадает в бедренную. Малая подкожная — позади наружной
    лодыжки, по задней стороне голени к подколенной вене. Глубокие вены
    (бедренная, подколенная) — пунктиром. Прободающие вены соединяют
    поверхностные с глубокими; клапаны показаны на большой подкожной.
  -->
  <path class="outline" d="M150 20C100 22 40 40 30 90C22 150 30 230 40 300C48 360 50 400 52 430C50 500 58 580 64 620L56 670H140C136 650 128 630 126 616C132 560 140 490 140 430C142 380 150 300 156 240C160 200 166 170 172 150V20Z"/>
  <path class="outline" d="M210 20C260 22 320 40 330 90C338 150 330 230 320 300C312 360 310 400 308 430C310 500 302 580 296 620L304 670H220C224 650 232 630 234 616C228 560 220 490 220 430C218 380 210 300 204 240C200 200 194 170 188 150V20Z"/>
  <path class="landmark" d="M180 10V670"/>

  <!-- спереди: глубокая бедренная вена -->
  <g data-term="t_femoral_vein">
    <path class="hit" stroke-width="48" d="M104 384C100 320 98 240 100 180C102 130 104 90 108 50"/>
    <path class="vessel-deoxy behind" stroke-width="10" d="M104 384C100 320 98 240 100 180C102 130 104 90 108 50"/>
  </g>
  <g data-term="t_perforating_veins">
    <path class="hit" stroke-width="48" d="M151 330L104 324M144 250L101 246"/>
    <path class="vessel-deoxy" stroke-width="4" d="M151 330L104 324M144 250L101 246"/>
  </g>
  <g data-term="t_great_saphenous_vein">
    <path class="hit" stroke-width="48" d="M128 660C130 640 132 620 134 600C138 540 140 480 144 430C150 380 152 320 146 260C138 190 120 120 110 80"/>
    <path class="vessel-deoxy" stroke-width="7" d="M128 660C130 640 132 620 134 600C138 540 140 480 144 430C150 380 152 320 146 260C138 190 120 120 110 80"/>
  </g>
  <g data-term="t_venous_valve">
    <circle class="hit hit-area" cx="133" cy="176" r="24"/>
    <circle class="hit hit-area" cx="141" cy="480" r="24"/>
    <path class="valve" d="M128 170L133 182L138 170Z M136 474L141 486L146 474Z"/>
  </g>

  <!-- сзади: глубокая подколенная вена и малая подкожная -->
  <g data-term="t_popliteal_vein">
    <path class="hit" stroke-width="48" d="M258 432C257 400 256 370 256 336"/>
    <path class="vessel-deoxy behind" stroke-width="10" d="M258 432C257 400 256 370 256 336"/>
  </g>
  <g data-term="t_small_saphenous_vein">
    <path class="hit" stroke-width="48" d="M300 660C298 640 296 622 290 600C282 570 270 540 266 500C262 470 260 440 258 412"/>
    <path class="vessel-deoxy" stroke-width="6" d="M300 660C298 640 296 622 290 600C282 570 270 540 266 500C262 470 260 440 258 412"/>
  </g>
</svg>
