<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" data-diagram="d_arm_nerves">
  <title>Нервы руки (правая рука спереди)</title>
  <!--
    Правая рука спереди, ладонь вперёд: большой палец (латеральная сторона)
    слева, мизинец справа; туловище — справа за краем руки. Плечевое
    сплетение спускается с шеи к подмышке, там начинаются его ветви.
    Мышечно-кожный — латерально, под двуглавой мышцей (пунктир), ниже
    локтя выходит под кожу. Срединный — по середине передней стороны,
    через запястный канал (пунктир под связкой) к ладони. Локтевой —
    по внутренней стороне, позади медиального надмыщелка (пунктир).
    Лучевой и подмышечный уходят назад: лучевой спиралью огибает плечевую
    кость сзади (пунктир) и выходит вперёд у латерального надмыщелка,
    подмышечный огибает шейку плечевой кости под дельтовидной мышцей.
    Трёхглавая мышца лежит сзади: спереди видны только её края.
  -->
  <path class="outline" d="M40 80C40 40 90 20 150 26C190 30 214 52 222 84C226 100 222 112 214 120C206 180 198 250 192 320C190 340 188 350 186 360C184 420 180 480 174 540C172 556 172 566 172 576C180 600 178 630 160 636H100C84 632 80 606 92 576C90 566 88 556 86 540C80 480 74 420 72 360C70 350 68 340 68 320C62 250 52 180 44 130C40 110 40 96 40 80Z"/>

