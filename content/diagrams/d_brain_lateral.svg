<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" data-diagram="d_brain_lateral">
  <title>Головной мозг: левое полушарие снаружи</title>
  <!--
    Вид слева, как в атласах: лобная доля слева, затылочная справа.
    Центральная борозда идёт от верхнего края вниз и вперёд и не доходит
    до латеральной; латеральная — от переднего нижнего края назад и вверх.
    Граница теменной и затылочной долей на наружной поверхности условна —
    линия от теменно-затылочной борозды к предзатылочной вырезке; так же
    условна граница височной и теменной долей. Остальные борозды —
    без подписи, внутри своих долей.
    Ниже полушария — мозжечок (сзади) и ствол: мост и продолговатый мозг
    (спереди от мозжечка); средний мозг скрыт височной долей.
  -->
  <g data-term="t_cerebellum" data-hit="area">
    <path class="brain" d="M296 232C290 212 260 204 230 210C204 216 190 230 192 248C194 264 214 272 242 270C272 268 298 254 296 232Z"/>
    <path class="sulcus" stroke-width="1.2" d="M206 232C230 226 260 226 288 236M200 248C228 244 262 246 290 252M210 262C236 260 262 262 282 264"/>
  </g>

  <g data-term="t_brainstem">
