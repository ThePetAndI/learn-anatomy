      </g>
      <g data-term="t_occipital_lobe" data-hit="area">
        <path class="lobe-4" d="M262 50C264 82 264 116 264 150C266 172 268 194 268 214C284 206 302 192 312 174C320 158 322 140 320 124C316 96 296 66 262 50Z"/>
        <path class="sulcus" stroke-width="1.5" d="M276 96C290 110 300 126 306 146"/>
